# PCB Defect Detection - YOLOv8-seg Training Dataset
# Classes: 6 PCB defect types
#
# LOCAL TRAINING (from project root):
#   path: 01_training/data/processed/pcb_seg
#
# COLAB TRAINING - override path before training:
#   path: /content/pcb-wafer-inspection-pipeline/01_training/data/processed/pcb_seg
#
# Annotation format: bbox-as-polygon (4-point, converted from Pascal VOC XML)
